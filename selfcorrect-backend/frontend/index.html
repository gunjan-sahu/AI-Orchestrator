<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New task · SYNORA</title>
  <meta name="description" content="Ask anything. SYNORA thinks, verifies and refines the answer." />
  <meta name="theme-color" content="#06070A" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="favicon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("scmap_theme")||"dark";document.documentElement.dataset.motion=localStorage.getItem("synora_motion")==="off"?"off":"on"}catch(e){}</script>
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="css/synora.css" />
</head>
<body data-page="orchestrator">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <div id="topbar-host"></div>
    <main id="main" class="content">
      <section class="stage" id="stage">
        <div id="orb-host" data-orb=""></div>
        <h1 class="greet" id="greeting">What should we work on?</h1>
        <p class="orb-status" id="status" role="status" aria-live="polite"><span id="status-text">Think. Verify. Refine.</span><span id="elapsed" hidden></span></p>
        <div id="agents-host" class="agents-wrap"></div>
        <form id="task-form" class="composer glass" novalidate>
          <div class="field">
            <label class="sr-only" for="prompt">Your prompt</label>
            <textarea class="textarea" id="prompt" name="prompt" maxlength="4000" required placeholder="Ask anything: maths, code, explanations, analysis…" aria-describedby="prompt-error prompt-help"></textarea>
            <div class="composer-foot">
              <span class="field-error" id="prompt-error"></span>
              <span class="hint" id="prompt-help"><span class="char-count" id="char-count">0 / 4,000</span> · <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> to run</span>
            </div>
          </div>
          <div class="examples" aria-label="Example prompts">
            <button type="button" class="example" data-example="Write a Python function that checks whether a string is a valid palindrome, ignoring punctuation and case. Include tests.">Code with tests</button>
            <button type="button" class="example" data-example="What is 100 / 5 * 2 + 3 ^ 2 - 8 / 4 * 3? Show the working.">Maths</button>
            <button type="button" class="example" data-example="Explain the difference between TCP and UDP to a first-year student, with two real-world examples of each.">Explain a concept</button>
            <button type="button" class="example" data-example="A bat and a ball cost 110 together. The bat costs 100 more than the ball. How much does the ball cost? Show your reasoning.">Trick question</button>
            <button type="button" class="example" data-example="A shop gives 20% off 850, then adds 18% GST on the discounted price, then a flat 50 delivery fee that is exempt from GST. What is the final price? Show every step.">Shop price</button>
          </div>
          <fieldset style="border:0;padding:0;margin:0">
            <legend class="sr-only">Answer mode</legend>
            <div class="modes">
              <div class="mode"><input type="radio" id="mode-verified" name="mode" value="self_correcting" checked /><label for="mode-verified"><strong><i data-icon="shield" data-size="16"></i>Verified</strong><span>Plans, drafts, reviews and corrects the answer before showing it. Slower, but more reliable.</span></label></div>
              <div class="mode"><input type="radio" id="mode-quick" name="mode" value="baseline" /><label for="mode-quick"><strong><i data-icon="exec" data-size="16"></i>Quick</strong><span>One direct answer with no review. Faster, but it may contain mistakes.</span></label></div>
            </div>
          </fieldset>
          <div class="run-row">
            <details class="adv" id="iter-wrap">
              <summary><i data-icon="chevD" data-size="14"></i>Advanced</summary>
              <label class="switch"><input type="checkbox" id="iter-toggle" /> Limit review rounds</label>
              <div class="range-group"><label for="max-iterations" class="sr-only">Maximum review rounds</label><input type="range" id="max-iterations" min="1" max="5" step="1" value="3" disabled /><span class="iter-value" id="iter-value">3</span></div>
            </details>
            <button type="submit" id="run-btn" class="btn btn-primary btn-lg"><i data-icon="send" data-size="16"></i><span class="btn-label">Run</span></button>
          </div>
        </form>
      </section>
      <section id="results" class="results" aria-label="Result" hidden></section>
    </main>
  </div>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/richtext.js"></script>
  <script src="js/aurora.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/task-view.js"></script>
  <script src="js/orchestrator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
