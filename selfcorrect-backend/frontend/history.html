<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>History · SYNORA</title>
  <meta name="description" content="Every task you have run, with its verified answer." />
  <meta name="theme-color" content="#06070A" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="favicon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("scmap_theme")||"dark";document.documentElement.dataset.motion=localStorage.getItem("synora_motion")==="off"?"off":"on"}catch(e){}</script>
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="css/synora.css" />
</head>
<body data-page="history">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <div id="topbar-host"></div>
    <main id="main" class="content">
      <div class="page-head"><div><span class="chip"><span class="dot"></span>History</span><h1 class="page-title" style="margin-top:14px">Your <em class="grad">answers</em></h1><p class="page-sub">Open any task to see the answer and its verification report.</p></div></div>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter by mode">
          <button type="button" class="filter-btn" data-filter="" aria-pressed="true">All</button>
          <button type="button" class="filter-btn" data-filter="self_correcting" aria-pressed="false">Verified</button>
          <button type="button" class="filter-btn" data-filter="baseline" aria-pressed="false">Quick</button>
        </div>
        <button type="button" id="refresh-btn" class="btn btn-ghost btn-sm"><i data-icon="refresh" data-size="14"></i><span class="btn-label">Refresh</span></button>
      </div>
      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <div class="pager">
        <span class="hint" id="page-info" aria-live="polite"></span>
        <div class="filters">
          <label class="sr-only" for="page-size">Tasks per page</label>
          <select id="page-size"><option value="10">10 / page</option><option value="20" selected>20 / page</option><option value="50">50 / page</option></select>
          <button type="button" id="prev-page" class="btn btn-ghost btn-sm"><i data-icon="chevL" data-size="14"></i><span class="btn-label">Newer</span></button>
          <button type="button" id="next-page" class="btn btn-ghost btn-sm"><span class="btn-label">Older</span><i data-icon="chevR" data-size="14"></i></button>
        </div>
      </div>
      <aside id="task-detail" class="drawer" role="dialog" aria-modal="true" aria-label="Task details" hidden></aside>
    </main>
  </div>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/richtext.js"></script>
  <script src="js/aurora.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/task-view.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
