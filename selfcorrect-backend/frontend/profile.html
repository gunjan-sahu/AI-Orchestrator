<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile · SYNORA</title>
  <meta name="description" content="Your account, results and recent tasks." />
  <meta name="theme-color" content="#06070A" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="favicon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("scmap_theme")||"dark";document.documentElement.dataset.motion=localStorage.getItem("synora_motion")==="off"?"off":"on"}catch(e){}</script>
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="css/synora.css" />
</head>
<body data-page="profile">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app" id="app">
    <div id="topbar-host"></div>
    <main id="main" class="content">
      <div class="page-head"><div><span class="chip"><span class="dot"></span>Profile</span><h1 class="page-title" style="margin-top:14px">Your <em class="grad">workspace</em></h1></div></div>
      <div class="profile-grid">
        <section class="card reveal" aria-labelledby="acct-title"><div id="account"></div>
          <div class="profile-actions"><a class="btn btn-primary" href="index.html"><i data-icon="plus" data-size="16"></i><span class="btn-label">New task</span></a><a class="btn btn-ghost" href="history.html"><i data-icon="history" data-size="16"></i><span class="btn-label">History</span></a><button type="button" id="copy-email" class="btn btn-ghost"><i data-icon="copy" data-size="16"></i><span class="btn-label">Copy email</span></button><button type="button" id="signout-btn" class="btn btn-danger"><i data-icon="logout" data-size="16"></i><span class="btn-label">Sign out</span></button></div></section>
        <section class="card reveal" aria-labelledby="snap-title"><div class="section-title"><div><span class="eyebrow">Snapshot</span><h2 id="snap-title">Your results</h2></div><a class="btn btn-ghost btn-sm" href="evaluation.html"><span class="btn-label">Details</span><i data-icon="chevR" data-size="14"></i></a></div><div id="snapshot"></div></section>
      </div>
      <section aria-labelledby="recent-title"><div class="section-title"><div><span class="eyebrow">Latest</span><h2 id="recent-title">Recent tasks</h2></div><a class="btn btn-ghost btn-sm" href="history.html"><span class="btn-label">View all</span><i data-icon="chevR" data-size="14"></i></a></div><ul id="recent" class="task-list"></ul></section>
    </main>
  </div>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/richtext.js"></script>
  <script src="js/aurora.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/task-view.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
