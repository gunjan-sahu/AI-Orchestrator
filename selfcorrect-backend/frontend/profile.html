<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile · Recursive Multi-Agent Pipeline</title>
  <meta name="description" content="Your account, your results and recent tasks." />
  <meta name="theme-color" content="#0E100E" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <script>document.documentElement.dataset.theme = localStorage.getItem("scmap_theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="profile">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="grid-bg" aria-hidden="true"></div>
  <header class="site-header" id="site-header"></header>

  <main id="main" class="container">
    <section class="page-hero reveal">
      <div>
        <span class="chip"><span class="dot"></span>Profile</span>
        <h1>Your <span class="gradient-text">workspace.</span></h1>
        <p>Account details, a snapshot of your results, and your most recent runs.</p>
      </div>
    </section>

    <div class="profile-grid">
      <section class="card card-glow reveal" aria-labelledby="acct-title">
        <div id="account"></div>
        <div class="profile-actions">
          <a class="btn btn-primary" href="index.html"><i data-icon="play" data-size="16"></i><span class="btn-label">New task</span></a>
          <a class="btn btn-ghost" href="history.html"><i data-icon="history" data-size="16"></i><span class="btn-label">History</span></a>
          <a class="btn btn-ghost" href="evaluation.html"><i data-icon="chart" data-size="16"></i><span class="btn-label">Evaluation</span></a>
          <button type="button" id="copy-email" class="btn btn-ghost"><i data-icon="copy" data-size="16"></i><span class="btn-label">Copy email</span></button>
          <button type="button" id="signout-btn" class="btn btn-danger"><i data-icon="logout" data-size="16"></i><span class="btn-label">Sign out</span></button>
        </div>
      </section>
      <section class="card reveal" aria-labelledby="snap-title">
        <div class="section-title"><div><span class="eyebrow">Snapshot</span><h2 id="snap-title">Your results</h2></div>
          <a class="btn btn-ghost btn-sm" href="evaluation.html"><span class="btn-label">Details</span><i data-icon="chevR" data-size="14"></i></a></div>
        <div id="snapshot"></div>
      </section>
    </div>

    <section class="card reveal" aria-labelledby="recent-title">
      <div class="section-title"><div><span class="eyebrow">Latest</span><h2 id="recent-title">Recent tasks</h2></div>
        <a class="btn btn-ghost btn-sm" href="history.html"><span class="btn-label">View all</span><i data-icon="chevR" data-size="14"></i></a></div>
      <ul id="recent" class="task-list"></ul>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/task-view.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
