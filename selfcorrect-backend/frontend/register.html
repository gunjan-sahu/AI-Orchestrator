<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create your account · SYNORA</title>
  <meta name="description" content="Think. Verify. Refine." />
  <meta name="theme-color" content="#06070A" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="favicon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("scmap_theme")||"dark";document.documentElement.dataset.motion=localStorage.getItem("synora_motion")==="off"?"off":"on"}catch(e){}</script>
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="css/synora.css" />
</head>
<body data-page="register">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="auth-corner"><button type="button" class="icon-btn theme-toggle" aria-label="Toggle theme"></button></div>
  <main id="main" class="auth-stage">
    <section class="auth-card glass">
      <div class="auth-top"><div data-orb="small"></div></div>
      <div style="text-align:center"><h1>Create your account</h1><p class="muted" style="margin-top:6px">Think. Verify. Refine.</p></div>
      <form id="auth-form" novalidate>
        <div class="form-banner" role="alert" hidden></div>
        <div class="field" style="margin-bottom:14px"><label class="label" for="full_name">Full name</label><input class="input" id="full_name" name="full_name" type="text" autocomplete="name" placeholder="Your name" required /><span class="field-error" data-error-for="full_name"></span></div>
        <div class="field" style="margin-bottom:14px"><label class="label" for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required /><span class="field-error" data-error-for="email"></span></div>
        <div class="field" style="margin-bottom:14px"><label class="label" for="password">Password (8+ characters, a letter and a number)</label><div class="input-wrap"><input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="" required /><button type="button" class="pw-toggle" data-target="password" aria-label="Show password"></button></div><span class="field-error" data-error-for="password"></span></div>
        <div class="field" style="margin-bottom:14px"><label class="label" for="confirm">Confirm password</label><div class="input-wrap"><input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="" required /><button type="button" class="pw-toggle" data-target="confirm" aria-label="Show password"></button></div><span class="field-error" data-error-for="confirm"></span></div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top:6px"><span class="btn-label">Create account</span><i data-icon="chevR" data-size="16"></i></button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </section>
  </main>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/richtext.js"></script>
  <script src="js/aurora.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/task-view.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
